name: Run one-time bilingual backport for deep experiment

on:
  push:
    branches: [main]
    paths: [.github/workflows/run-bilingual-backport.yml]

permissions:
  contents: write

jobs:
  backport:
    if: contains(github.event.head_commit.message, 'Run one-time bilingual backport for deep experiment')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out deep server experiment
        uses: actions/checkout@v4
        with:
          ref: codex/server-translation-experimental
          fetch-depth: 0

      - name: Fetch named main refs and Verba peer
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git clone --branch codex/server-translation-experimental --single-branch https://github.com/foreverharibo-boop/verba.git ../peer
          git -C ../peer fetch origin main:refs/remotes/origin/main
          curl -fsSL https://raw.githubusercontent.com/foreverharibo-boop/verba/43e278d9451467f179816bd25715c82946e65ff8/tools/backport-bilingual-once.cjs -o /tmp/backport-bilingual-once.cjs

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch browser and server sources
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'index.js';
          const source = fs.readFileSync(file, 'utf8');
          if (!source.includes('VERBA_DEEP_MAX_TOKENS')) throw new Error('Deep token constant not found');
          fs.writeFileSync(file, source.replaceAll('VERBA_DEEP_MAX_TOKENS', 'VERBA_MAX_TOKENS'));
          NODE
          node /tmp/backport-bilingual-once.cjs "$PWD/../peer" "$PWD"
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'index.js';
          const source = fs.readFileSync(file, 'utf8');
          fs.writeFileSync(file, source.replaceAll('VERBA_MAX_TOKENS', 'VERBA_DEEP_MAX_TOKENS'));
          NODE
          npm install --prefix ../peer/tools --no-audit --no-fund
          node ../peer/tools/build-server-engines.cjs "$PWD/../peer" "$PWD"

      - name: Run regressions
        shell: bash
        run: |
          set -euo pipefail
          node tests/bilingual-intent.mjs
          node tests/bilingual-source-recovery-smoke.mjs
          node tests/bilingual-dialogue-local-format.mjs
          node --test server-plugin/tests/engine.test.mjs server-plugin/tests/bilingual-backport.test.mjs
          node --check index.js
          git diff --check

      - name: Commit deep experiment changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --stat
          git commit -m "Backport strict bilingual handling to deep server experiment (v0.6.43)"
          git push origin HEAD:codex/server-translation-experimental

      - name: Remove one-time runner from main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git worktree add ../main-clean origin/main
          rm -f ../main-clean/.github/workflows/run-bilingual-backport.yml
          git -C ../main-clean config user.name github-actions[bot]
          git -C ../main-clean config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C ../main-clean add -A
          if ! git -C ../main-clean diff --cached --quiet; then
            git -C ../main-clean commit -m "Remove one-time bilingual backport runner"
            git -C ../main-clean push origin HEAD:main
          fi
