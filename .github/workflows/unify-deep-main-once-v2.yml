name: Unify Deep server translation into main v2
on:
  push:
    branches:
      - codex/server-translation-experimental
    paths:
      - .github/workflows/unify-deep-main-once-v2.yml
permissions:
  contents: write
jobs:
  unify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/server-translation-experimental
          fetch-depth: 0
      - name: Apply verified Deep integration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          source=Path('.github/workflows/unify-deep-main-once.yml').read_text()
          marker='      - name: Merge main and import verified shared runtime\n'
          start=source.index(marker)
          run=source.index('        run: |\n',start)+len('        run: |\n')
          end=source.index('\n      - name: Run Deep regressions\n',run)
          Path('/tmp/deep-unify.sh').write_text(textwrap.dedent(source[run:end]))
          PY
          bash /tmp/deep-unify.sh

      - name: Preserve minimal-mode isolation and update test fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old,new,1)

          # Minimal mode is an intentionally isolated single-pass engine. It must
          # return before bilingual-intent planning or any other helper request.
          path=Path('index.js')
          text=path.read_text()
          old=(
              "    const initialSegmented = segmentSource(source, characterNameLocks, segmentationOptions);\n"
              "    await planBilingualDialogueVerdicts(initialSegmented, { signal: options.signal, timing: options.timing });\n"
              "    if (minimalOutputEnabled(settings)) {\n"
              "        return translateMinimalOutput(initialSegmented, settings, options, { requestSegments, buildSourceMap, reviewEnglish: reviewFinalEnglish });\n"
              "    }\n"
              "    const roleTermLocks = await planRepeatedRoleTermLocks(initialSegmented, {"
          )
          new=(
              "    const initialSegmented = segmentSource(source, characterNameLocks, segmentationOptions);\n"
              "    if (minimalOutputEnabled(settings)) {\n"
              "        return translateMinimalOutput(initialSegmented, settings, options, { requestSegments, buildSourceMap, reviewEnglish: reviewFinalEnglish });\n"
              "    }\n"
              "    await planBilingualDialogueVerdicts(initialSegmented, { signal: options.signal, timing: options.timing });\n"
              "    const roleTermLocks = await planRepeatedRoleTermLocks(initialSegmented, {"
          )
          path.write_text(replace_once(text,old,new,'minimal mode before bilingual planning'))

          path=Path('tests/diagnostics.mjs')
          text=path.read_text()
          old="""const api = Function('settings', 'document', 'copyText', 'debugDiagnosticText',
              'verbaServer', 'createDebugDiagnostic', 'pendingOutputs', 'automaticTranslationTimers', 'swipeTranslationJobs', 'serverRetryStates',
              'let lastDebugDiagnostic = null;\\n' + storeSource + copySource + '\\nreturn { storeDebugDiagnostic, copyDebugDiagnostic, latest: () => lastDebugDiagnostic };')(
              settings, { querySelector: () => button }, async value => copies.push(JSON.parse(value)), JSON.stringify,
              { refreshDiagnostics: async () => {} }, () => ({ automaticOutput: { events: [...lifecycleEvents] } }), outputJobs, new Map(), new Map(), retries);"""
          new="""const api = Function('settings', 'document', 'copyText', 'debugDiagnosticText',
              'verbaServer', 'createDebugDiagnostic', 'pendingOutputs', 'automaticTranslationTimers', 'swipeTranslationJobs', 'serverRetryStates',
              'executionTrace', 'traceLatestAssistantSource',
              'let lastDebugDiagnostic = null;\\n' + storeSource + copySource + '\\nreturn { storeDebugDiagnostic, copyDebugDiagnostic, latest: () => lastDebugDiagnostic };')(
              settings, { querySelector: () => button }, async value => copies.push(JSON.parse(value)), JSON.stringify,
              { refreshDiagnostics: async () => {} }, () => ({ automaticOutput: { events: [...lifecycleEvents] } }), outputJobs, new Map(), new Map(), retries,
              { heartbeat() {} }, () => {});"""
          text=replace_once(text,old,new,'diagnostic fixture dependencies')
          old_assert="assert.ok(index.includes('if (!settings.debugMode) lastDebugDiagnostic = null;'));"
          new_assert="assert.match(index, /if \\(!settings\\.debugMode\\) \\{[\\s\\S]*?lastDebugDiagnostic = null;/);"
          text=replace_once(text,old_assert,new_assert,'diagnostic reset assertion')
          path.write_text(text)

          path=Path('tests/display-resume.mjs')
          text=path.read_text()
          old="""const env={EXTENSION_KEY:'verba',STATE_KEY:'verba',SOURCE_VIEW_KEY:'sourceView',settings:{autoOutput:true},
           automaticOutputLifecycle:lifecycle,isTranslationExtensionActive:()=>owner,liveContext:()=>({chat}),"""
          new="""const env={EXTENSION_KEY:'verba',STATE_KEY:'verba',SOURCE_VIEW_KEY:'sourceView',settings:{autoOutput:true},
           executionTrace:{heartbeat(){}},traceLatestAssistantSource(){},
           automaticOutputLifecycle:lifecycle,isTranslationExtensionActive:()=>owner,liveContext:()=>({chat}),"""
          path.write_text(replace_once(text,old,new,'display resume fixture dependencies'))

          path=Path('tests/minimal-output.mjs')
          text=path.read_text()
          old="const route=Function('settings','normalizedCharacterNameLocks','segmentSource','minimalOutputEnabled','translateMinimalOutput','requestSegments','buildSourceMap','planRepeatedRoleTermLocks','reviewFinalEnglish',between('async function translateOutputText(', 'function inputIdentitySpellingContext(')+'\\nreturn translateOutputText;');"
          new="const route=Function('settings','normalizedCharacterNameLocks','segmentSource','minimalOutputEnabled','translateMinimalOutput','requestSegments','buildSourceMap','planBilingualDialogueVerdicts','planRepeatedRoleTermLocks','reviewFinalEnglish',between('async function translateOutputText(', 'function inputIdentitySpellingContext(')+'\\nreturn translateOutputText;');"
          text=replace_once(text,old,new,'minimal route helper parameters')
          old="const run=route(settings,()=>[],segmentSource,minimalOutputEnabled,translateMinimalOutput,requestSegments,buildSourceMap,()=>{throw Error('NORMAL_PATH');},async ({translations})=>{assert.ok(translations instanceof Map);});"
          new="const run=route(settings,()=>[],segmentSource,minimalOutputEnabled,translateMinimalOutput,requestSegments,buildSourceMap,async()=>{},()=>{throw Error('NORMAL_PATH');},async ({translations})=>{assert.ok(translations instanceof Map);});"
          path.write_text(replace_once(text,old,new,'minimal route helper arguments'))
          PY

      - name: Run all current Deep regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check index.js
          node --check source-change-tracer.js
          node --check browser-execution-diagnostics.js
          retired="$(node -e "const x=require('./TEST-MIGRATION.json'); console.log(Object.keys(x.findings||{}).join('\\n'))")"
          for test_file in tests/*.mjs; do
            base="$(basename "$test_file")"
            if grep -Fxq "$base" <<<"$retired"; then
              echo "==> SKIP documented legacy test: $test_file"
              continue
            fi
            echo "==> $test_file"
            node "$test_file"
          done

      - name: Commit integrated Deep branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Merge server translation into Deep main-ready build (v0.6.44)"
          git push origin HEAD:codex/server-translation-experimental
