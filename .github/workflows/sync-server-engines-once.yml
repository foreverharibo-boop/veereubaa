name: Sync verified server engines into deep experiment

on:
  push:
    branches: [main]
    paths: [.github/workflows/sync-server-engines-once.yml]

permissions:
  contents: write

jobs:
  sync:
    if: contains(github.event.head_commit.message, 'Sync verified server engines into deep experiment')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out deep server experiment
        uses: actions/checkout@v4
        with:
          ref: codex/server-translation-experimental
          fetch-depth: 0

      - name: Copy verified engine bundle from Verba experiment
        shell: bash
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/foreverharibo-boop/verba/codex/server-translation-experimental/server-plugin/engines
          curl -fsSL "$base/verba.mjs" -o server-plugin/engines/verba.mjs
          curl -fsSL "$base/verba-deep.mjs" -o server-plugin/engines/verba-deep.mjs
          curl -fsSL "$base/manifest.json" -o server-plugin/engines/manifest.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify copied engines
        shell: bash
        run: |
          set -euo pipefail
          node --test server-plugin/tests/engine.test.mjs server-plugin/tests/bilingual-backport.test.mjs
          git diff --check

      - name: Commit exact engine sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server-plugin/engines
          if ! git diff --cached --quiet; then
            git commit -m "Sync verified shared server engines with Verba experiment"
            git push origin HEAD:codex/server-translation-experimental
          fi

      - name: Remove one-time runner from main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git worktree add ../main-clean origin/main
          rm -f ../main-clean/.github/workflows/sync-server-engines-once.yml
          git -C ../main-clean config user.name github-actions[bot]
          git -C ../main-clean config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C ../main-clean add -A
          if ! git -C ../main-clean diff --cached --quiet; then
            git -C ../main-clean commit -m "Remove one-time server engine sync runner"
            git -C ../main-clean push origin HEAD:main
          fi
