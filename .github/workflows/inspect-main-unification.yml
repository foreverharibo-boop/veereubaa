name: Inspect deep main unification
on:
  push:
    branches:
      - codex/server-translation-experimental
    paths:
      - .github/workflows/inspect-main-unification.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/server-translation-experimental
          fetch-depth: 0
      - name: Inspect merge conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          set -e
          echo "merge_status=$status"
          git diff --name-only --diff-filter=U || true
          git status --short
          git merge --abort || true
